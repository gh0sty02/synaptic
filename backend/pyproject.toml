[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled by formatter, not a hard error
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "chain", "context", "ingestion", "memory", "retrieval", "tools"]
