services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synaptic
      POSTGRES_USER: synaptic
      POSTGRES_PASSWORD: synaptic_local
    ports: ['5433:5432']
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptic -d synaptic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports: ['8000:8000']
    env_file: .env
    environment:
      # Override connection strings to use Docker service hostnames
      CONN_STR: postgresql+psycopg://synaptic:synaptic_local@postgres:5432/synaptic
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ['3000:3000']
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pg_data:
