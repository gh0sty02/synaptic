services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synaptic
      POSTGRES_USER: synaptic
      POSTGRES_PASSWORD: synaptic_local
    ports: ['5433:5432']
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptic -d synaptic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://synaptic:synaptic_local@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local_secret
      SALT: local_salt
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      LLM_BASE_URL: http://host.docker.internal:8888/
      POSTGRES_URL: postgresql://synaptic:synaptic_local@postgres:5432/synaptic
      REDIS_URL: redis://redis:6379
      LANGFUSE_HOST: http://langfuse:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   ports: ['5173:5173']
  #   depends_on: [backend]

volumes:
  pg_data:
